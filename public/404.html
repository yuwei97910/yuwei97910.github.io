<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Yuwei Lai</title>
    <script>
      // spa-github-pages (https://github.com/rafgraph/spa-github-pages)
      // GitHub Pages serves this for unknown paths; encode the path into the
      // query string and bounce to index.html, which restores it before React boots.
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      );
    </script>
  </head>
  <body></body>
</html>
