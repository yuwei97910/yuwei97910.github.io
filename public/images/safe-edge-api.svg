    <g fill="#0f172a" font-size="21" font-weight="700"><text x="106" y="263">Edge Apps</text><text x="106" y="423">Upstream Apps</text><text x="456" y="304">Golang API</text><text x="795" y="180">Auth</text><text x="795" y="295">Cache</text><text x="795" y="410">Databases</text><text x="795" y="525">Message Bus</text></g>
    <g fill="#475569" font-size="15"><text x="106" y="291">dashboards + tools</text><text x="106" y="451">notifications</text><text x="456" y="333">validation + routing</text><text x="456" y="358">contracts + controls</text><text x="795" y="206">token + signature</text><text x="795" y="321">hot responses</text><text x="795" y="436">records + events</text><text x="795" y="551">async workflows</text></g>
