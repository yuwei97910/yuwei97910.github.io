  <title id="title">Public-safe Edge API architecture</title>
  <desc id="desc">Generic architecture diagram for edge API gateway, authentication, cache, databases, messaging, and device-control workflows.</desc>
  <defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2 2l8 4-8 4z" fill="#2563eb"/></marker></defs>
