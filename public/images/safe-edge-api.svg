  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif">
    <text x="58" y="74" font-size="34" font-weight="700" fill="#0f172a">Edge API Service Pattern</text>
    <text x="60" y="108" font-size="16" fill="#475569">Public-safe API pattern for edge applications, data services, and device-control workflows</text>
    <g fill="#fff" stroke="#cbd5e1" stroke-width="2">
      <rect x="70" y="225" width="195" height="95" rx="18"/><rect x="70" y="385" width="195" height="95" rx="18"/>
